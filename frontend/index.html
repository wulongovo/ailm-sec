<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AILLM-SEC - AI Security Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #1e293b, #334155); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #475569; }
        .header h1 { font-size: 20px; color: #38bdf8; }
        .header .status { font-size: 12px; color: #94a3b8; }
        .chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
        .user { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
        .assistant { align-self: flex-start; background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .sources { font-size: 11px; color: #64748b; margin-top: 8px; padding-top: 8px; border-top: 1px solid #334155; }
        .input-area { padding: 16px 24px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 12px; }
        .input-area textarea { flex: 1; background: #0f172a; border: 1px solid #475569; color: #e2e8f0; padding: 12px; border-radius: 8px; resize: none; font-size: 14px; font-family: inherit; }
        .input-area textarea:focus { outline: none; border-color: #3b82f6; }
        .input-area button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
        .input-area button:hover { background: #2563eb; }
        .input-area button:disabled { background: #475569; cursor: not-allowed; }
        .toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
        .toggle input { accent-color: #3b82f6; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AILLM-SEC</h1>
        <div class="status">
            <label class="toggle"><input type="checkbox" id="ragToggle" checked> RAG</label>
            <span id="statusText">Ready</span>
        </div>
    </div>
    <div class="chat-container" id="chat"></div>
    <div class="input-area">
        <textarea id="input" rows="2" placeholder="Ask a security question..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
        <button onclick="sendMessage()" id="btn">Send</button>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const btn = document.getElementById('btn');
        const ragToggle = document.getElementById('ragToggle');
        const statusText = document.getElementById('statusText');

        function addMessage(role, text, sources) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = text;
            if (sources && sources.length) {
                const src = document.createElement('div');
                src.className = 'sources';
                src.textContent = 'Sources: ' + sources.map(s => s.metadata?.id || s.metadata?.category || 'doc').join(', ');
                div.appendChild(src);
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            addMessage('user', msg);
            btn.disabled = true;
            statusText.textContent = 'Thinking...';

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg, use_rag: ragToggle.checked}),
                });
                const data = await resp.json();
                addMessage('assistant', data.answer, data.sources);
            } catch (e) {
                addMessage('assistant', 'Error: ' + e.message);
            }
            btn.disabled = false;
            statusText.textContent = 'Ready';
        }
    </script>
</body>
</html>
